syntax = "proto3";

package driver;

service DriverService {
  rpc CreateDriver (CreateDriverRequest) returns (Driver);
  rpc GetDriver (GetDriverRequest) returns (Driver);
  rpc UpdateDriverLocation (UpdateDriverLocationRequest) returns (Driver);
  rpc UpdateDriverStatus (UpdateDriverStatusRequest) returns (Driver);
  rpc ListDrivers (ListDriversRequest) returns (ListDriversResponse);
}

message Driver {
  string id = 1;
  string name = 2;
  string vehicle = 3;
  string status = 4; // AVAILABLE, BUSY, OFFLINE
  double latitude = 5;
  double longitude = 6;
}

message CreateDriverRequest {
  string name = 1;
  string vehicle = 2;
}

message GetDriverRequest {
  string id = 1;
}

message UpdateDriverLocationRequest {
  string id = 1;
  double latitude = 2;
  double longitude = 3;
}

message UpdateDriverStatusRequest {
  string id = 1;
  string status = 2;
}

message ListDriversRequest {}

message ListDriversResponse {
  repeated Driver drivers = 1;
}
